<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ── Reset & Root ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #050810;
  --bg2:       #080d1a;
  --panel:     rgba(6, 18, 45, 0.7);
  --blue:      #00d4ff;
  --blue-dim:  #0066aa;
  --blue-glow: rgba(0, 212, 255, 0.18);
  --amber:     #ff8c00;
  --amber-dim: #8b4500;
  --green:     #00ff88;
  --text:      #c8e4f8;
  --text-dim:  #4a6a8a;
  --border:    rgba(0, 180, 220, 0.2);
  --font-hud:  'Orbitron', monospace;
  --font-mono: 'Share Tech Mono', monospace;
  --radius:    4px;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 14px;
  overflow: hidden;
}

/* ── Grid background ──────────────────────────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,180,220,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,180,220,.04) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,100,200,.12) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── App shell ────────────────────────────────────────────────────────── */
#app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
  margin: 0;
  padding: 0 16px 16px;
}

/* ── Header ───────────────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-arc {
  width: 36px;
  height: 36px;
  position: relative;
  flex-shrink: 0;
}
.logo-arc svg {
  width: 100%;
  height: 100%;
  animation: arc-rotate 8s linear infinite;
}
@keyframes arc-rotate {
  to { transform: rotate(360deg); }
}

.logo-text {
  font-family: var(--font-hud);
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.18em;
  color: var(--blue);
  text-shadow: 0 0 24px rgba(0,212,255,.7), 0 0 8px rgba(0,212,255,.4);
}
.logo-sub {
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--text-dim);
  margin-top: 1px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.sys-time {
  font-family: var(--font-hud);
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
}

.clear-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  padding: 4px 10px;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all 0.2s;
}
.clear-btn:hover {
  border-color: var(--blue-dim);
  color: var(--blue);
}

/* ── Status bar ───────────────────────────────────────────────────────── */
#status-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0 8px;
  flex-shrink: 0;
}

.status-orb {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: background 0.3s, box-shadow 0.3s;
  flex-shrink: 0;
}
.status-orb.idle     { background: var(--blue-dim); box-shadow: none; }
.status-orb.thinking { background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: pulse-amber 0.8s ease-in-out infinite alternate; }
.status-orb.speaking { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse-green 0.5s ease-in-out infinite alternate; }

@keyframes pulse-amber {
  from { box-shadow: 0 0 4px var(--amber); }
  to   { box-shadow: 0 0 18px var(--amber); }
}
@keyframes pulse-green {
  from { box-shadow: 0 0 4px var(--green); }
  to   { box-shadow: 0 0 18px var(--green); }
}

#status-label {
  font-family: var(--font-hud);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--text-dim);
  text-transform: uppercase;
  transition: color 0.3s;
  min-width: 80px;
}
#status-label.thinking { color: var(--amber); }
#status-label.speaking { color: var(--green); }
#status-label.idle     { color: var(--blue-dim); }

.hud-divider {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
}

#model-badge {
  font-size: 9px;
  letter-spacing: 0.16em;
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 2px;
  color: var(--text-dim);
  text-transform: uppercase;
  transition: all 0.3s;
  min-width: 72px;
  text-align: center;
}
#model-badge.chat      { border-color: var(--blue-dim); color: var(--blue-dim); }
#model-badge.reasoning { border-color: var(--amber-dim); color: var(--amber); }
#model-badge.action    { border-color: rgba(0,200,100,.35); color: var(--green); }
#model-badge.fast      { border-color: var(--border); color: var(--text-dim); }

/* ── Chat area ────────────────────────────────────────────────────────── */
#chat {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 0 4px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
#chat::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Chat bubbles ─────────────────────────────────────────────────────── */
.msg {
  display: flex;
  gap: 10px;
  animation: msg-in 0.25s ease both;
  max-width: 100%;
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg.user  { flex-direction: row-reverse; }

.msg-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-hud);
  font-size: 9px;
  letter-spacing: 0.05em;
  flex-shrink: 0;
  margin-top: 2px;
}
.msg.jarvis .msg-avatar {
  background: radial-gradient(circle, rgba(0,100,200,.4), rgba(0,30,70,.8));
  border: 1px solid var(--blue-dim);
  color: var(--blue);
  box-shadow: 0 0 10px rgba(0,150,200,.2);
}
.msg.user .msg-avatar {
  background: radial-gradient(circle, rgba(120,60,0,.4), rgba(60,20,0,.8));
  border: 1px solid var(--amber-dim);
  color: var(--amber);
}

.msg-body {
  flex: 1;
  min-width: 0;
}

.msg-meta {
  font-size: 9px;
  letter-spacing: 0.14em;
  color: var(--text-dim);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.msg.user .msg-meta { flex-direction: row-reverse; }

.msg-name  { text-transform: uppercase; }

.msg-bubble {
  padding: 10px 14px;
  border-radius: var(--radius);
  line-height: 1.65;
  word-break: break-word;
  position: relative;
  max-width: 78%;
}

.msg.jarvis .msg-bubble {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-left: 2px solid var(--blue-dim);
  box-shadow: inset 0 0 30px rgba(0,50,120,.1);
}
.msg.user .msg-bubble {
  background: rgba(20, 10, 0, 0.6);
  border: 1px solid rgba(180, 100, 0, 0.18);
  color: var(--text);
  border-right: 2px solid var(--amber-dim);
  margin-left: auto;
}

/* Thinking dots */
.thinking-dots span {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--blue);
  margin-right: 4px;
  animation: dot-bounce 1.2s ease-in-out infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; margin-right: 0; }
@keyframes dot-bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40%            { transform: translateY(-5px); opacity: 1; }
}

/* ── Input area ───────────────────────────────────────────────────────── */
#input-area {
  flex-shrink: 0;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

#user-input {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 14px;
  padding: 10px 14px;
  outline: none;
  resize: none;
  min-height: 44px;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#user-input::placeholder { color: var(--text-dim); }
#user-input:focus {
  border-color: var(--blue-dim);
  box-shadow: 0 0 0 1px rgba(0,180,220,.15), 0 0 16px rgba(0,100,200,.1);
}

#send-btn, #micBtn {
  width: 44px;
  height: 44px;
  background: radial-gradient(circle, rgba(0,80,160,.5), rgba(0,30,80,.8));
  border: 1px solid var(--blue-dim);
  border-radius: var(--radius);
  color: var(--blue);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
#send-btn:hover, #micBtn:hover {
  background: radial-gradient(circle, rgba(0,130,210,.5), rgba(0,60,130,.8));
  box-shadow: 0 0 14px rgba(0,180,255,.25);
}
#send-btn:active, #micBtn:active { transform: scale(0.95); }
#send-btn:disabled, #micBtn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

#send-btn svg { pointer-events: none; }

/* ── HUD corners (decorative) ─────────────────────────────────────────── */
.hud-corner {
  position: fixed;
  width: 40px;
  height: 40px;
  pointer-events: none;
  z-index: 2;
}
.hud-corner.tl { top: 8px; left: 8px; border-top: 1px solid var(--blue-dim); border-left: 1px solid var(--blue-dim); }
.hud-corner.tr { top: 8px; right: 8px; border-top: 1px solid var(--blue-dim); border-right: 1px solid var(--blue-dim); }
.hud-corner.bl { bottom: 8px; left: 8px; border-bottom: 1px solid var(--blue-dim); border-left: 1px solid var(--blue-dim); }
.hud-corner.br { bottom: 8px; right: 8px; border-bottom: 1px solid var(--blue-dim); border-right: 1px solid var(--blue-dim); }

/* ── Scan line ────────────────────────────────────────────────────────── */
.scan-line {
  position: fixed;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,180,220,.18), transparent);
  pointer-events: none;
  z-index: 1;
  animation: scan 8s linear infinite;
}
@keyframes scan {
  0%   { top: -1px; opacity: 0; }
  5%   { opacity: 1; }
  95%  { opacity: 1; }
  100% { top: 100vh; opacity: 0; }
}

/* ── Welcome message ─────────────────────────────────────────────────── */
#welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 16px;
  color: var(--text-dim);
  animation: msg-in 0.6s ease both;
}
#welcome svg { opacity: 0.15; }
#welcome p {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
</style>
</head>
<body>

<!-- HUD decoration -->
<div class="hud-corner tl"></div>
<div class="hud-corner tr"></div>
<div class="hud-corner bl"></div>
<div class="hud-corner br"></div>
<div class="scan-line"></div>

<div id="app">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-arc">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="7" fill="rgba(0,100,200,.25)" stroke="#00d4ff" stroke-width="0.8"/>
          <circle cx="18" cy="18" r="3" fill="rgba(0,180,255,.5)"/>
          <path d="M18 2 A16 16 0 0 1 34 18" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
          <path d="M34 18 A16 16 0 0 1 18 34" stroke="#0066aa" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
          <path d="M18 34 A16 16 0 0 1 2 18" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/>
          <path d="M2 18 A16 16 0 0 1 18 2" stroke="#0066aa" stroke-width="1.2" stroke-linecap="round" opacity="0.15"/>
          <circle cx="18" cy="2" r="2" fill="#00d4ff"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">JARVIS</div>
        <div class="logo-sub">Just A Rather Very Intelligent System</div>
      </div>
    </div>
    <div class="header-right">
      <span class="sys-time" id="sys-time">--:--:--</span>
      <button class="clear-btn" onclick="clearChat()">CLEAR</button>
    </div>
  </header>

  <!-- Status bar -->
  <div id="status-bar">
    <div class="status-orb idle" id="status-orb"></div>
    <span id="status-label" class="idle">STANDBY</span>
    <div class="hud-divider"></div>
    <div id="model-badge" class="fast">FAST</div>
  </div>

  <!-- Chat -->
  <div id="chat">
    <div id="welcome">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="16" stroke="#00d4ff" stroke-width="1"/>
        <circle cx="32" cy="32" r="8" fill="rgba(0,100,200,.3)" stroke="#00d4ff" stroke-width="0.8"/>
        <circle cx="32" cy="32" r="3" fill="#00d4ff"/>
        <path d="M32 4 A28 28 0 0 1 60 32" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M60 32 A28 28 0 0 1 32 60" stroke="#0066aa" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M32 60 A28 28 0 0 1 4 32" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
        <path d="M4 32 A28 28 0 0 1 32 4" stroke="#0066aa" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
      </svg>
      <p>Systems online · Ready for input</p>
    </div>
  </div>

  <!-- Input area -->
  <div id="input-area">
    <div class="input-row">
      <textarea
        id="user-input"
        placeholder="Enter command..."
        rows="1"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button id="micBtn" title="Voice Input">🎤</button>
      <button id="send-btn" onclick="sendMessage()" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const API = '';  // empty = same origin (Flask serves UI + API)
let thinking = false;

// ── Clock ──────────────────────────────────────────────────────────────
function updateClock() {
  document.getElementById('sys-time').textContent =
    new Date().toLocaleTimeString('en-US', { hour12: false });
}
setInterval(updateClock, 1000);
updateClock();

// ── Status ─────────────────────────────────────────────────────────────
const STATE_LABELS = { idle: 'STANDBY', thinking: 'PROCESSING', speaking: 'RESPONDING' };
function setStatus(state, modelType = '') {
  const orb   = document.getElementById('status-orb');
  const label = document.getElementById('status-label');
  const badge = document.getElementById('model-badge');

  orb.className   = `status-orb ${state}`;
  label.className = state;
  label.textContent = STATE_LABELS[state] || state.toUpperCase();

  if (modelType) {
    badge.className   = `${modelType}`;
    const labels = { chat: 'CHAT', reasoning: 'REASONING', action: 'ACTION', fast: 'FAST' };
    badge.textContent = labels[modelType] || modelType.toUpperCase();
  }
}

// ── DOM helpers ────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function appendMsg(role, text, ts, modelType = '') {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const chat   = document.getElementById('chat');
  const isUser = role === 'user';
  const name   = isUser ? 'ARJU' : 'JARVIS';
  const avatar = isUser ? 'AR' : 'JV';

  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-body">
      <div class="msg-meta">
        <span class="msg-name">${name}</span>
        <span>${esc(ts || '')}</span>
      </div>
      <div class="msg-bubble">${esc(text)}</div>
    </div>
  `;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function appendThinking() {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const chat = document.getElementById('chat');
  const el   = document.createElement('div');
  el.className = 'msg jarvis';
  el.id = 'thinking-msg';
  el.innerHTML = `
    <div class="msg-avatar">JV</div>
    <div class="msg-body">
      <div class="msg-meta"><span class="msg-name">JARVIS</span></div>
      <div class="msg-bubble"><div class="thinking-dots"><span></span><span></span><span></span></div></div>
    </div>
  `;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function removeThinking() {
  const el = document.getElementById('thinking-msg');
  if (el) el.remove();
}

// ── Auto-resize textarea ───────────────────────────────────────────────
const textarea = document.getElementById('user-input');
textarea.addEventListener('input', () => {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
});
textarea.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById("micBtn").onclick = async () => {
  const res = await fetch(`${API}/api/listen`);
  const data = await res.json();
  
  if (data.text) {
      sendMessage(data.text);
  }
};

function speakText(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    speechSynthesis.speak(utterance);
}

// ── Send ───────────────────────────────────────────────────────────────
async function sendMessage(overrideText = null) {
  if (thinking) return;
  const input = typeof overrideText === 'string' ? overrideText : textarea.value.trim();
  if (!input) return;

  textarea.value = '';
  textarea.style.height = 'auto';

  const ts = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
  appendMsg('user', input, ts);

  thinking = true;
  document.getElementById('send-btn').disabled = true;
  setStatus('thinking');
  appendThinking();

  try {
    const resp = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: input }),
    });

    const data = await resp.json();
    removeThinking();

    const reply     = data.response || '(no response)';
    const modelType = data.model_type || 'fast';
    const replyTs   = data.timestamp || ts;

    setStatus('speaking', modelType);
    lastLiveMessage = reply;
    appendMsg('jarvis', reply, replyTs, modelType);
    speakText(reply);

    // Brief "speaking" state then back to idle
    setTimeout(() => setStatus('idle', modelType), 1400);

  } catch (err) {
    removeThinking();
    appendMsg('jarvis', 'Connection error. Is the server running?', ts);
    setStatus('idle');
  }

  thinking = false;
  document.getElementById('send-btn').disabled = false;
  textarea.focus();
}

// ── Clear ──────────────────────────────────────────────────────────────
async function clearChat() {
  try {
    await fetch(`${API}/api/clear`, { method: 'POST' });
  } catch (_) {}
  const chat = document.getElementById('chat');
  chat.innerHTML = `
    <div id="welcome" style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px;color:var(--text-dim);animation:msg-in .6s ease both">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="16" stroke="#00d4ff" stroke-width="1" opacity="0.15"/>
        <circle cx="32" cy="32" r="8" fill="rgba(0,100,200,.3)" stroke="#00d4ff" stroke-width="0.8" opacity="0.15"/>
        <circle cx="32" cy="32" r="3" fill="#00d4ff" opacity="0.15"/>
      </svg>
      <p style="font-size:11px;letter-spacing:.2em;text-transform:uppercase">Systems online · Ready for input</p>
    </div>`;
  setStatus('idle');
  document.getElementById('model-badge').className = 'fast';
  document.getElementById('model-badge').textContent = 'FAST';
}

// ── Load history on start ──────────────────────────────────────────────
async function loadHistory() {
  try {
    const resp = await fetch(`${API}/api/history`);
    const data = await resp.json();
    if (data.history && data.history.length > 0) {
      data.history.forEach(m => appendMsg(m.role, m.text, m.ts));
    }
  } catch (_) {}
}

let lastLiveMessage = "";

function addMessage(role, text) {
  const ts = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
  appendMsg(role, text, ts);
}

setInterval(async () => {
  try {
    const res = await fetch(`${API}/api/live`);
    const data = await res.json();

    if (data.text && data.text !== lastLiveMessage) {
      lastLiveMessage = data.text;
      addMessage("jarvis", data.text);
    }
  } catch (err) {}
}, 2000);

loadHistory();
textarea.focus();
</script>
</body>
</html>
